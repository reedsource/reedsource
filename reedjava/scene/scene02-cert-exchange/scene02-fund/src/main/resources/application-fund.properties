#资方方(中信)独立配置文件 编码 UTF-8
#服务端口
server.port=8083
#应用名称
spring.application.name=scene02-fund

#本端角色
scene02.role=fund
#本端证书接口路径 对应文档8.1.2
scene02.self-cert-path=/scene02/api/8.1.2/fund-cert
#对端为平台方(京东方) 其证书接口路径对应文档8.1.1
scene02.peer-base-url=http://localhost:8082
scene02.peer-cert-path=/scene02/api/8.1.1/platform-cert
#报文接收路径 双方同路径
scene02.message-path=/scene02/api/message

#证书交换间隔 毫秒 默认5分钟
scene02.exchange-interval-ms=300000
#定时任务首次延迟 毫秒
scene02.exchange-initial-delay-ms=5000
#每个自然日真实拉取对端证书的次数上限
scene02.daily-pull-threshold=3
#到期前提醒阈值 天
scene02.expiry-warn-days=30
#本端证书有效期 天
scene02.cert-validity-days=365
#对端连接超时 毫秒
scene02.peer-timeout-ms=5000
#共享信任根证书库口令
scene02.trust-root-password=scene02

#案例验证使用的双方地址
scene02.platform-base-url=http://localhost:8082
scene02.fund-base-url=http://localhost:8083

#日志
logging.level.top.ireed=info
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
